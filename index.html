<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    background:linear-gradient(135deg,#111,#222);
    padding:18px;
    text-align:center;
    font-size:25px;
    font-weight:bold;
    position:sticky;
    top:0;
    z-index:1000;
    border-bottom:1px solid #333;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:15px;
}

.section-title{
    font-size:24px;
    margin:20px 0 15px;
    font-weight:bold;
}

.search-box{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #333;
    background:#111;
    color:white;
    font-size:16px;
    outline:none;
    margin-bottom:18px;
}

.search-box:focus{
    border-color:#777;
}

.player-box{
    background:#000;
    border-radius:12px;
    overflow:hidden;
    border:1px solid #222;
    position:relative;
    margin-bottom:20px;
}

video{
    width:100%;
    max-height:600px;
    background:#000;
    display:block;
}

.loading{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,.8);
    padding:12px 18px;
    border-radius:8px;
    display:none;
    z-index:5;
}

.now-playing{
    padding:12px;
    background:#111;
    font-size:16px;
    font-weight:bold;
}

.channels-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:15px;
}

.channel-card{
    background:#111;
    border:1px solid #292929;
    border-radius:12px;
    padding:12px;
    cursor:pointer;
    transition:.2s;
    text-align:center;
}

.channel-card:hover{
    transform:translateY(-3px);
    border-color:#666;
    background:#181818;
}

.channel-logo{
    width:100%;
    height:100px;
    object-fit:contain;
    background:#050505;
    border-radius:8px;
    margin-bottom:10px;
}

.channel-name{
    font-weight:bold;
    font-size:15px;
}

/* MOVIES */

.movie-section{
    margin-top:35px;
}

.movie-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:18px;
}

.movie-card{
    background:#111;
    border:1px solid #292929;
    border-radius:12px;
    overflow:hidden;
    transition:.2s;
}

.movie-card:hover{
    transform:translateY(-4px);
    border-color:#666;
}

.movie-poster{
    width:100%;
    height:270px;
    object-fit:cover;
    background:#191919;
    display:block;
}

.movie-info{
    padding:12px;
}

.movie-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:8px;
}

.movie-meta{
    font-size:13px;
    color:#bbb;
    margin-bottom:7px;
}

.movie-description{
    color:#aaa;
    font-size:13px;
    line-height:1.4;
    min-height:55px;
}

.movie-buttons{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:12px;
}

.watch-btn,
.source-btn{
    border:0;
    border-radius:8px;
    padding:10px;
    cursor:pointer;
    font-weight:bold;
}

.watch-btn{
    background:#e50914;
    color:#fff;
}

.watch-btn:hover{
    background:#ff1824;
}

.source-btn{
    background:#292929;
    color:#fff;
}

.source-btn:hover{
    background:#3a3a3a;
}

.movie-status{
    color:#aaa;
    margin-bottom:15px;
}

/* MODAL */

.movie-modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    z-index:2000;
    padding:20px;
    overflow:auto;
}

.movie-modal-content{
    max-width:1000px;
    margin:30px auto;
    background:#111;
    border:1px solid #333;
    border-radius:14px;
    overflow:hidden;
    position:relative;
}

.movie-modal-video{
    width:100%;
    max-height:650px;
    background:#000;
}

.movie-modal-info{
    padding:18px;
}

.movie-modal-title{
    font-size:25px;
    font-weight:bold;
    margin-bottom:10px;
}

.movie-modal-description{
    color:#bbb;
    line-height:1.6;
}

.movie-close{
    position:absolute;
    right:12px;
    top:12px;
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.8);
    color:#fff;
    font-size:22px;
    cursor:pointer;
    z-index:10;
}

.badge{
    display:inline-block;
    padding:5px 8px;
    border-radius:6px;
    background:#222;
    color:#ddd;
    font-size:12px;
    margin:3px 3px 3px 0;
}

footer{
    text-align:center;
    color:#777;
    padding:30px 15px;
    margin-top:30px;
    border-top:1px solid #222;
}

@media(max-width:600px){

    header{
        font-size:21px;
    }

    .channels-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .movie-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .channel-logo{
        height:85px;
    }

    .movie-poster{
        height:230px;
    }

    .movie-title{
        font-size:15px;
    }

    .movie-description{
        font-size:12px;
    }
}

/* LIVE VIEWER */
.live-viewer{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:12px auto 18px;
    padding:9px 14px;
    width:max-content;
    max-width:100%;
    background:#111;
    border:1px solid #292929;
    border-radius:999px;
    font-size:14px;
    font-weight:bold;
    box-shadow:0 3px 12px rgba(0,0,0,.25);
}
.live-dot{
    width:9px;
    height:9px;
    background:#22c55e;
    border-radius:50%;
    box-shadow:0 0 8px rgba(34,197,94,.8);
    animation:livePulse 1.4s infinite;
}
@keyframes livePulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.45;transform:scale(.82)}
}
.live-count{color:#fff}
.live-label{color:#aaa}

.channel-groups {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.group-btn {
    background: #171717;
    color: #fff;
    border: 1px solid #333;
    border-radius: 20px;
    padding: 10px 17px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.group-btn:hover {
    background: #292929;
    border-color: #777;
}

.group-btn.active {
    background: #e50914;
    border-color: #e50914;
    color: #fff;
}

@media (max-width: 600px) {
    .channel-groups {
        gap: 7px;
    }

    .group-btn {
        padding: 9px 12px;
        font-size: 12px;
    }
}

</style>
</head>

   LIVE VIEWER

   realtime service (Firebase/Supabase/etc.). This safe
   fallback keeps the counter visible without changing
   the existing TV/movie functionality.
===================================================== */
(function(){
    const countEl = document.getElementById("liveViewerCount");
    const pluralEl = document.getElementById("liveViewerPlural");
    if(!countEl) return;

    // Temporary local fallback: current browser session = 1 viewer.
    // Replace only this small block with a realtime provider when credentials exist.
    let count = 1;
    countEl.textContent = count;
    if(pluralEl) pluralEl.style.display = count === 1 ? "none" : "inline";
})();
</script>

/* =====================================================
   PLAYER
===================================================== */

const video =
    document.getElementById("video");

const loading =
    document.getElementById("loading");

const nowPlaying =
    document.getElementById("nowPlaying");

const channelsContainer =
    document.getElementById("channels");

const searchInput =
    document.getElementById("search");

let hls = null;


function playChannel(channel){

    loading.style.display = "block";

    nowPlaying.textContent =
        "▶ " + channel.name;


    if(hls){

        hls.destroy();
        hls = null;

    }


    video.pause();

    video.removeAttribute("src");

    video.load();


    if(
        window.Hls &&
        Hls.isSupported()
    ){

        hls = new Hls();

        hls.loadSource(channel.url);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                loading.style.display =
                    "none";

                video.play().catch(
                    function(){}
                );

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function(event,data){

                if(data.fatal){

                    loading.style.display =
                        "none";

                    nowPlaying.textContent =
                        "❌ Unable to play " +
                        channel.name;

                }

            }
        );

    }

    else if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src =
            channel.url;


        video.addEventListener(
            "loadedmetadata",
            function(){

                loading.style.display =
                    "none";

                video.play().catch(
                    function(){}
                );

            },
            {
                once:true
            }
        );

    }

    else{

        loading.style.display =
            "none";

        nowPlaying.textContent =
            "❌ HLS is not supported";

    }

}


/* =====================================================
   SHOW CHANNELS
===================================================== */

function showChannels(list){

    channelsContainer.innerHTML = "";


    if(list.length === 0){

        channelsContainer.innerHTML =
            '<div style="color:#aaa;padding:15px;">No channel found.</div>';

        return;

    }


    list.forEach(function(channel){

        const card =
            document.createElement("div");

        card.className =
            "channel-card";


        card.innerHTML = `

            <img
                class="channel-logo"
                src="${channel.logo}"
                alt="${channel.name}"
                loading="lazy"
                onerror="this.src='https://via.placeholder.com/200x120/111111/ffffff?text=TV'"
            >

            <div class="channel-name">
                ${channel.name}
            </div>

        `;


        card.addEventListener(
            "click",
            function(){

                playChannel(channel);

                window.scrollTo({
                    top:0,
                    behavior:"smooth"
                });

            }
        );


        channelsContainer.appendChild(card);

    });

}

/* CHANNEL GROUPING — original channel URLs unchanged */

const groupButtons = document.getElementById("channelGroups");
let selectedCategory = "All";

function getCategory(channel) {
    const name = channel.name.trim().toUpperCase();

    // Sports
    if (/BEIN SPORTS XTRA|WILLOW|FIFA +|FIFA SPORTS|INTER MILAN TV|STAR SPORTS-2 HD|AMAZONNAWS HD|NAUTICAL SPORTS|PK SPORTS HD|A SPORTS/.test(name)) {
        return "Sports";
    }

    // Music
    if (/MUSIC|A MUSIC TV|9X TASHAN/.test(name)) {
        return "Music";
    }

    // Nature
    if (/NATURE/.test(name)) {
        return "Nature";
    }

    // Bangla channels
    if (/ATN NEWS|JAMUNA TV|NEWS 24|NTV HD|STAR JOLSHA|ZEE BANGLA|DEEPTO TV|PEACE TV BANGLA|ENTER10 BANGLA|SRK TV HD|SANANDA TV/.test(name)) {
        return "Bangla";
    }

    // Hindi / Indian entertainment and movies
    if (/STAR MAA|MAHA MAX|GOLDMINES|HORROR CINEMA|MOVIES|BIZ CINEMA|THE MOVIES CLUB|CLASSIC MOVIES|BHUJPURI CINEMA|FREE MOVIES/.test(name)) {
        return "Hindi";
    }

    return "Other";
}

function renderChannels() {
    const query = searchInput.value.toLowerCase().trim();

    const filtered = channels.filter(function(channel) {
        const matchesSearch = channel.name.toLowerCase().includes(query);
        const matchesCategory =
            selectedCategory === "All" ||
            getCategory(channel) === selectedCategory;

        return matchesSearch && matchesCategory;
    });

    showChannels(filtered);
}

groupButtons.addEventListener("click", function(event) {
    const button = event.target.closest(".group-btn");
    if (!button) return;

    selectedCategory = button.dataset.category;

    groupButtons.querySelectorAll(".group-btn").forEach(function(btn) {
        btn.classList.toggle("active", btn === button);
    });

    renderChannels();
});

searchInput.addEventListener("input", renderChannels);

// Display all channels on startup
renderChannels();




function closeMovie(){

    movieVideo.pause();

    movieVideo.removeAttribute("src");

    movieVideo.load();

    movieModal.style.display =
        "none";

    document.body.style.overflow =
        "";

}


movieClose.addEventListener(
    "click",
    closeMovie
);


movieModal.addEventListener(
    "click",
    function(event){

        if(
            event.target === movieModal
        ){

            closeMovie();

        }

    }
);


document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape" &&
            movieModal.style.display === "block"
        ){

            closeMovie();

        }

    }
);
